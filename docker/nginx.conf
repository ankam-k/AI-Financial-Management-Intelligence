server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The dashboard is a single-page app: unknown paths are routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # One origin for the browser, so the API needs no CORS configuration.
    # This is the deployed equivalent of the Vite dev proxy (ADR-017).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generated narration on a local 7B model takes ~18s per insight, and
        # a chat answer can take longer. The default 60s would cut off a
        # legitimate response and look like a bug.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
